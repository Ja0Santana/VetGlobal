services:
  db:
    image: postgres:16-alpine
    container_name: vetglobal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vetglobal
      POSTGRES_PASSWORD: vetglobal
      POSTGRES_DB: vetglobal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetglobal -d vetglobal"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: vetglobal_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://vetglobal:vetglobal@db:5432/vetglobal
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./storage:/app/storage

volumes:
  postgres_data:
